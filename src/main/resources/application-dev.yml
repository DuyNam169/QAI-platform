spring:
  ai:
    openai:
      api-key: "dummy-not-used"
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false
  config:
    import: optional:dotenv:.env

logging:
  level:
    com.QAI.aichatbot: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG

ai:
  service:
    url: http://localhost:8000

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production-minimum-32-chars}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}